<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>360° Street View with Video Banner</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  touch-action: none; /* IMPORTANT FOR ANDROID */
}
canvas { 
  display: block; 
  touch-action: none; /* IMPORTANT */
}
#transitionOverlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, transparent 20%, #000 80%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
  z-index: 10;
}
.nav-btn {
  position: fixed;
  bottom: 24px;
  width: 140px;
  height: 54px;
  background: rgba(20,40,80,0.9);
  color: #fff;
  border: 1px solid rgba(120,180,255,0.6);
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  backdrop-filter: blur(10px);
  z-index: 15;
}
#prevBtn { left: 24px; }
#nextBtn { right: 24px; }
.zoom-btn {
  position: fixed;
  right: 24px;
  width: 54px;
  height: 54px;
  background: rgba(20,40,80,0.9);
  color: #fff;
  border: 1px solid rgba(120,180,255,0.6);
  border-radius: 50%;
  font-size: 26px;
  font-weight: bold;
  cursor: pointer;
  backdrop-filter: blur(10px);
  z-index: 15;
}
#zoomIn { bottom: 100px; }
#zoomOut { bottom: 160px; }
#soundBtn {
  position: fixed;
  top: 24px;
  right: 24px;
  padding: 12px 18px;
  border-radius: 12px;
  background: rgba(20,40,80,0.9);
  color: #fff;
  border: 1px solid rgba(120,180,255,0.6);
  cursor: pointer;
  z-index: 20;
}
</style>
</head>
<body>
<div id="transitionOverlay"></div>
<button id="prevBtn" class="nav-btn">← Back</button>
<button id="nextBtn" class="nav-btn">Forward →</button>
<button id="zoomIn" class="zoom-btn">+</button>
<button id="zoomOut" class="zoom-btn">−</button>
<button id="soundBtn">🔇 Sound Off</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>

let lastX = 0;
let lastY = 0;

let targetYaw = 0;
let targetPitch = 0;

const panoramas = [ /* SAME AS YOUR CODE */ 
  {
    url: "https://raw.githubusercontent.com/Gitboi46/360-viewer/main/Panorama3_Configuration1_BJP.jpg",
    forward: 1,
    backward: 7,
    hasVideo: true
  },
  {
    url: "https://raw.githubusercontent.com/Gitboi46/360-viewer/main/Panorama4.png",
    forward: 2,
    backward: 0
  },
  {
    url: "https://raw.githubusercontent.com/Gitboi46/360-viewer/main/Panorama5.png",
    forward: 3,
    backward: 1
  },
  {
    url: "https://raw.githubusercontent.com/Gitboi46/360-viewer/main/Panorama3.png",
    forward: 4,
    backward: 2
  },
  {
    url: "https://raw.githubusercontent.com/Gitboi46/360-viewer/main/Panorama4.png",
    forward: 5,
    backward: 3
  },
  {
    url: "https://raw.githubusercontent.com/Gitboi46/360-viewer/main/Panorama6.png",
    forward: 6,
    backward: 4
  },
  {
    url: "https://raw.githubusercontent.com/Gitboi46/360-viewer/main/Panorama7.png",
    forward: 7,
    backward: 5
  },
  {
    url: "https://raw.githubusercontent.com/Gitboi46/360-viewer/main/Panorama9.png",
    forward: 0,
    backward: 6
  }
];

let scene, camera, renderer, sphere;
let yaw = 0, pitch = 0;
let currentIndex = 0;
let isDragging = false;
let isTransitioning = false;
let videoMesh = null;
let videoElement = null;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const overlay = document.getElementById("transitionOverlay");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const zoomInBtn = document.getElementById("zoomIn");
const zoomOutBtn = document.getElementById("zoomOut");
const soundBtn = document.getElementById("soundBtn");

init();
animate();

prevBtn.onclick = () => move(false);
nextBtn.onclick = () => move(true);
zoomInBtn.onclick = () => zoom(-5);
zoomOutBtn.onclick = () => zoom(5);
soundBtn.onclick = toggleSound;

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 2000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  loadPanorama(0);

  renderer.domElement.addEventListener("pointerdown", onPointerDown, { passive: false });
  renderer.domElement.addEventListener("pointermove", onPointerMove, { passive: false });
  renderer.domElement.addEventListener("pointerup", () => isDragging = false);
  renderer.domElement.addEventListener("pointercancel", () => isDragging = false);
  renderer.domElement.addEventListener("wheel", e => zoom(e.deltaY * 0.02));
  window.addEventListener("resize", onResize);
}

function onPointerDown(e) {
  e.preventDefault();

  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  if (videoMesh) {
    const hits = raycaster.intersectObject(videoMesh);
    if (hits.length) {
      togglePlayPause();
      return;
    }
  }

  lastX = e.clientX;
  lastY = e.clientY;
  isDragging = true;
}

function onPointerMove(e) {
  if (!isDragging || isTransitioning) return;
  e.preventDefault();

  const deltaX = e.clientX - lastX;
  const deltaY = e.clientY - lastY;

  targetYaw += deltaX * 0.25;
  targetPitch += deltaY * 0.25;

  targetPitch = Math.max(-85, Math.min(85, targetPitch));

  lastX = e.clientX;
  lastY = e.clientY;
}

/* EVERYTHING ELSE SAME */

function loadPanorama(index) {
  new THREE.TextureLoader().load(panoramas[index].url, tex => {
    tex.colorSpace = THREE.SRGBColorSpace;

    if (!sphere) {
      const geo = new THREE.SphereGeometry(500, 64, 48);
      geo.scale(-1, 1, 1);
      sphere = new THREE.Mesh(
        geo,
        new THREE.MeshBasicMaterial({ map: tex })
      );
      scene.add(sphere);
    } else {
      sphere.material.map = tex;
      sphere.material.needsUpdate = true;
    }

    removeVideoBanner();
    if (panoramas[index].hasVideo) addVideoBanner();

    currentIndex = index;
  });
}

/* KEEP ALL YOUR ORIGINAL FUNCTIONS HERE (addVideoBanner, move, zoom etc) */
/* Not repeating them to keep message readable — they remain exactly same */

function animate() {
  requestAnimationFrame(animate);

  // SMOOTH DAMPING
  yaw += (targetYaw - yaw) * 0.1;
  pitch += (targetPitch - pitch) * 0.1;

  camera.rotation.order = "YXZ";
  camera.rotation.y = THREE.MathUtils.degToRad(yaw);
  camera.rotation.x = THREE.MathUtils.degToRad(pitch);

  renderer.render(scene, camera);
}

</script>
</body>
</html>
